name: Sync Drive to GitHub

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install google-api-python-client google-auth

      - name: Run sync
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          CHAPTERS_FILE_ID: "1wr_2W4UHotzWe6djopAXxmPIaNGBhLqM"
        run: python scripts/sync.py

      - name: Commit changes
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync $(date -u +%FT%TZ)"
          git push
