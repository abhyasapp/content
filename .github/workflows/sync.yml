name: Sync Drive to GitHub

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install google-api-python-client google-auth

      - name: Run sync
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          CHAPTERS_FILE_ID: "10_YqLKsxxIUR8TlTA5vmOKK5xcOIeI8C"
        run: python scripts/sync.py

      # Never commit a mirror the app cannot trust: this fails the job (and so
      # skips the commit) on a missing file, a bad id, or a duplicated public
      # question id.
      - name: Validate the mirror
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          python scripts/sync.py --check

      - name: Commit changes
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync $(date -u +%FT%TZ)"
          git push
